name: customs-internal-workbench

services:
  reverse-proxy:
    image: ${REVERSE_PROXY_IMAGE:?pin_exact_digest}
    ports:
      - "8443:8443"
    volumes:
      - type: bind
        source: ./deploy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${CUSTOMS_TLS_DIR:?required}
        target: /run/tls
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?pin the exact Frontend image digest}
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  backend-migrate:
    image: ${BACKEND_IMAGE:?pin_exact_digest}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - "${CUSTOMS_BACKEND_MIGRATION_ENV_FILE:?required}"
    depends_on:
      operations-db-role-reconcile:
        condition: service_completed_successfully
    networks: [backend-state]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?pin_exact_digest}
    env_file:
      - "${CUSTOMS_BACKEND_ENV_FILE:?required}"
    volumes:
      - type: bind
        source: ${CUSTOMS_RELEASE_DIR:?required}
        target: /run/customs-releases
        read_only: true
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        # Candidate control-plane may start while Agent/Data release readiness
        # remains honestly 503. Reverse-proxy ingress still waits for Backend
        # full readiness, so no review traffic is admitted prematurely.
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [edge, backend-state, agent-api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  worker:
    image: ${BACKEND_IMAGE:?pin_exact_digest}
    command: ["dramatiq", "customs_backend.worker", "--processes", "1", "--threads", "4"]
    env_file:
      - "${CUSTOMS_BACKEND_ENV_FILE:?required}"
    volumes:
      - type: bind
        source: ${CUSTOMS_RELEASE_DIR:?required}
        target: /run/customs-releases
        read_only: true
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks: [backend-state, agent-api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  outbox-dispatcher:
    image: ${BACKEND_IMAGE:?pin_exact_digest}
    command: ["customs-outbox-dispatcher"]
    env_file:
      - "${CUSTOMS_BACKEND_OUTBOX_ENV_FILE:?required}"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend-state]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  keycloak:
    image: ${KEYCLOAK_IMAGE:?pin_exact_digest}
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /oidc
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${CUSTOMS_PUBLIC_HOST:?required}
      CUSTOMS_PUBLIC_ORIGIN: https://${CUSTOMS_PUBLIC_HOST:?required}
    volumes:
      - type: bind
        source: ./deploy/keycloak/customs-realm.json
        target: /opt/keycloak/data/import/customs-realm.json
        read_only: true
    depends_on:
      identity-db:
        condition: service_healthy
    networks: [edge, identity-state]
    restart: unless-stopped

  identity-db:
    image: ${POSTGRES_IMAGE:?pin_exact_digest}
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      POSTGRES_DB: keycloak
    volumes: ["identity-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [identity-state]
    restart: unless-stopped

  operations-db:
    image: ${POSTGRES_IMAGE:?pin_exact_digest}
    environment:
      POSTGRES_USER: customs_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?required}
      POSTGRES_DB: customs
    volumes:
      - operations-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customs_migrator -d customs"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend-state]
    restart: unless-stopped

  operations-db-role-reconcile:
    image: ${POSTGRES_IMAGE:?pin_exact_digest}
    command: ["/run/customs-bootstrap/reconcile-runtime-role.sh"]
    environment:
      PGHOST: operations-db
      PGDATABASE: customs
      PGUSER: customs_migrator
      PGPASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?required}
      CUSTOMS_RUNTIME_DB_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?required}
    volumes:
      - type: bind
        source: ./deploy/postgres/reconcile-runtime-role.sh
        target: /run/customs-bootstrap/reconcile-runtime-role.sh
        read_only: true
    depends_on:
      operations-db:
        condition: service_healthy
    networks: [backend-state]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: "no"

  redis:
    image: ${REDIS_IMAGE:?pin_exact_digest}
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend-state]
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:?pin_exact_digest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend-state]
    restart: unless-stopped

  agent:
    image: ${AGENT_IMAGE:?pin the exact Agent image digest}
    env_file:
      - "${AGENT_ENV_FILE:?required}"
    environment:
      HTTPS_PROXY: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      NO_PROXY: evidence-proxy,127.0.0.1,localhost
      no_proxy: evidence-proxy,127.0.0.1,localhost
      EVIDENCE_SERVICE_BASE_URL: https://evidence-proxy:8443
      EVIDENCE_SERVICE_ALLOWED_ORIGINS: https://evidence-proxy:8443
      SSL_CERT_FILE: /run/customs-ca/ca-bundle.pem
      CUSTOMS_AGENT_MAX_BODY_BYTES: "2097152"
      CUSTOMS_AGENT_MAX_DOCUMENTS: "6"
      CUSTOMS_AGENT_MAX_TEXT_CHARACTERS: "500000"
    volumes:
      - type: bind
        source: ${CUSTOMS_AGENT_CA_BUNDLE_FILE:?required}
        target: /run/customs-ca/ca-bundle.pem
        read_only: true
    depends_on:
      data:
        condition: service_healthy
      evidence-proxy:
        condition: service_started
      egress-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Agent has no direct external bridge. Claude HTTPS is forced through the
    # CONNECT allowlist proxy while Evidence stays on the private service network.
    networks: [agent-api, evidence-api, agent-proxy]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  evidence-proxy:
    image: ${EVIDENCE_PROXY_IMAGE:?pin_exact_digest}
    user: "65532:65532"
    command: ["nginx", "-g", "daemon off; pid /tmp/nginx.pid;"]
    volumes:
      - type: bind
        source: ./deploy/evidence-nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${CUSTOMS_EVIDENCE_TLS_DIR:?required}
        target: /run/evidence-tls
        read_only: true
    depends_on:
      data:
        condition: service_healthy
    networks:
      evidence-api: {}
      evidence-ingress:
        ipv4_address: 172.31.252.2
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  egress-proxy:
    image: ${EGRESS_PROXY_IMAGE:?pin_exact_digest}
    command: ["squid", "-NYC", "-d", "1", "-f", "/etc/squid/anthropic-egress.conf"]
    volumes:
      - type: bind
        source: ./deploy/anthropic-egress-squid.conf
        target: /etc/squid/anthropic-egress.conf
        read_only: true
    networks: [agent-proxy, proxy-egress]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/log/squid
      - /var/spool/squid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

  data:
    image: ${DATA_IMAGE:?pin the exact Data Platform image digest}
    command: ["python", "-m", "src.production_v3"]
    env_file:
      - "${DATA_ENV_FILE:?required}"
    environment:
      EVIDENCE_TRANSPORT_MODE: trusted_proxy_tls
      EVIDENCE_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,172.31.252.0/29
      EVIDENCE_BIND_HOST: 0.0.0.0
      EVIDENCE_PORT: "8010"
      EVIDENCE_ENABLE_OPENAPI: "false"
    volumes:
      - type: bind
        source: ${EVIDENCE_REQUIREMENT_POLICY_RELEASE_FILE:?required}
        target: /run/evidence-release/requirement-policy.json
        read_only: true
      - type: bind
        source: ${EVIDENCE_TRUSTED_REVIEWERS_FILE:?required}
        target: /run/evidence-release/trusted-reviewers.json
        read_only: true
    # Data readiness is authenticated. Compose checks only public liveness;
    # Agent /health/ready performs the authenticated, pinned V3 readiness probe.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8010/internal/rag/v3/health/live', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks:
      evidence-ingress:
        ipv4_address: 172.31.252.3
      data-store-tls: {}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

networks:
  # Host ingress remains available only through the reverse-proxy published port.
  # `internal` prevents Backend/Frontend/Keycloak from using this bridge as an
  # unintended general Internet egress path.
  edge:
    internal: true
  backend-state:
    internal: true
  identity-state:
    internal: true
  agent-api:
    internal: true
  evidence-api:
    internal: true
  evidence-ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.31.252.0/29
  # Production Data stores are deliberately outside this Compose project.
  # The operator-provisioned network may contain only TLS endpoints using a
  # read-only Data credential. Data ProductionSettings rejects PostgreSQL
  # without sslmode, Qdrant without HTTPS/API key, and unencrypted Neo4j URIs.
  data-store-tls:
    external: true
    name: ${CUSTOMS_DATA_STORE_TLS_NETWORK:?required}
  agent-proxy:
    internal: true
  proxy-egress: {}

volumes:
  operations-db: {}
  identity-db: {}
  redis: {}
  minio: {}
