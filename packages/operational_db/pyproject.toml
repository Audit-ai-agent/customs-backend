[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customs-operational-db"
version = "0.1.0"
description = "Immutable operational persistence for customs AI review runs"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
