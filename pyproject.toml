[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customs-backend"
version = "0.2.0"
description = "Backend-owned operational persistence and local Agent integration harness"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
unit = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
system = [
  # Exact provider runtime set. The Agent wheel itself is installed --no-deps
  # only after its identity and SHA-256 have been verified.
  "langgraph==1.2.9",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "rapidfuzz==3.14.5",
  "uvicorn[standard]>=0.30,<1",
]
production = [
  "dramatiq[redis]>=1.17,<3",
  "minio>=7.2,<8",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.9,<2",
  "defusedxml>=0.7,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.8,<1",
]

[project.scripts]
customs-review = "integration.headless_review:main"
customs-agent-demo = "integration.agent_webapp:main"
customs-backend-api = "customs_backend.main:main"
customs-outbox-dispatcher = "customs_backend.outbox_dispatcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "packages/operational_db/src"]
include = ["customs_backend*", "integration*", "operational_db*"]

[tool.setuptools.package-data]
integration = ["agent_webui.html", "agent_contract.json"]
customs_backend = [
  "agent_contract.lock.json",
  "domain_reviewer_trust_store.json",
  "contracts/agent/v3/*.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["packages/operational_db/tests", "tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "postgres_integration: requires an explicitly ephemeral migrated PostgreSQL DSN",
  "system: requires the exact AI Agent distribution and optional local services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "packages/operational_db/src", "tests", "packages/operational_db/tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src", "packages/operational_db/src"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true
