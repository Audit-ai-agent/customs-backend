[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customs-backend"
version = "0.2.0"
description = "Backend-owned operational persistence and Agent HTTP contract consumer"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
unit = [
  "pytest>=8,<10",
]
functional-uat = [
  "minio>=7.2,<8",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
customs-backend-api = "customs_backend.main:main"
customs-backend-profile-init = "customs_backend.local_profile:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["customs_backend*"]

[tool.setuptools.package-data]
customs_backend = [
  "contracts/agent/v3/*.schema.json",
  "contracts/evidence/v3/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true
