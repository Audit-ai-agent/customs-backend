[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customs-backend"
version = "0.1.0"
description = "Backend-owned operational persistence and local Agent integration harness"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
unit = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
system = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  # Exact provider runtime set. The Agent wheel itself is installed --no-deps
  # only after its identity and SHA-256 have been verified.
  "langgraph==1.2.9",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "rapidfuzz==3.14.5",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
customs-review = "integration.headless_review:main"
customs-agent-demo = "integration.agent_webapp:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "packages/operational_db/src"]
include = ["integration*", "operational_db*"]

[tool.setuptools.package-data]
integration = ["agent_webui.html", "agent_contract.json"]

[tool.pytest.ini_options]
testpaths = ["packages/operational_db/tests", "tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "system: requires the exact AI Agent distribution and optional local services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "packages/operational_db/src", "tests", "packages/operational_db/tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src", "packages/operational_db/src"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true
