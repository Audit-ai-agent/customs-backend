name: backend-lock-audit

on:
  pull_request:
    paths: [uv.lock]
  push:
    branches: [main]
    paths: [uv.lock]

permissions:
  contents: read

concurrency:
  group: backend-lock-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"
  PYTHON_VERSION: "3.11"
  UV_PROJECT_ENVIRONMENT: /tmp/customs-backend-audit-env

jobs:
  locked-dependencies:
    name: Audit changed lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Backend (shallow)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install only the locked audit toolchain
        run: uv sync --locked --group dev --python "${PYTHON_VERSION}"

      - name: Export and audit the exact locked dependency graph
        run: |
          uv export --quiet --locked --all-groups --all-extras \
            --no-emit-project --no-emit-local --no-sources \
            --format requirements.txt \
            --output-file "${RUNNER_TEMP}/backend-locked-requirements.txt"
          uv run --no-sync pip-audit \
            --requirement "${RUNNER_TEMP}/backend-locked-requirements.txt" \
            --require-hashes --disable-pip --strict --progress-spinner off
