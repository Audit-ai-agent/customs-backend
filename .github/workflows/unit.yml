name: backend-checks

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_PROJECT_ENVIRONMENT: /tmp/customs-backend-env

jobs:
  quick-and-contract:
    name: Quick and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Backend (shallow)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked lightweight check environment
        run: >-
          uv sync --locked --group dev --extra unit
          --python "${PYTHON_VERSION}"

      - name: Quick check
        run: uv run --no-sync python tools/check_backend.py quick

      - name: Contract check
        run: uv run --no-sync python tools/check_backend.py contract

      - name: Confirm no tracked output was generated
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
