name: backend-checks

on:
  pull_request:
    paths:
      - ".github/workflows/unit.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "deploy/functional-uat/**"
      - "README.md"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/unit.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "deploy/functional-uat/**"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_PROJECT_ENVIRONMENT: /tmp/customs-backend-env

jobs:
  quick-and-contract:
    name: Quick and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Backend (shallow)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install locked lightweight check environment
        run: >-
          uv sync --locked --group dev --extra unit
          --python "${PYTHON_VERSION}"

      - name: Quick check
        run: uv run --no-sync python tools/check_backend.py quick

      - name: Contract check
        run: uv run --no-sync python tools/check_backend.py contract

      - name: Confirm no tracked output was generated
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Redacted secret scan
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status -
          tar -xzf "$archive" gitleaks
          scan_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$scan_root"
          ./gitleaks dir "$scan_root" --config .gitleaks.toml --redact --no-banner --exit-code 1
