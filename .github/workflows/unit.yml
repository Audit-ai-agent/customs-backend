name: unit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  operational-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked Python 3.11 environment
        run: uv sync --locked --group dev --extra unit --python 3.11
      - name: Lint
        run: uv run --locked ruff check .
      - name: Typecheck
        run: uv run --locked mypy
      - name: Run Operational DB unit tests
        run: uv run --locked --extra unit pytest packages/operational_db/tests tests/unit
      - name: Build clean wheel
        run: uv build
