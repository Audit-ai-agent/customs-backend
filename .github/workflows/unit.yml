name: backend-checks

on:
  pull_request:
    paths:
      - ".github/workflows/unit.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "migrations/**"
      - "packages/**"
      - "deploy/uat/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/unit.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "migrations/**"
      - "packages/**"
      - "deploy/uat/**"

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.28"
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_PROJECT_ENVIRONMENT: /tmp/customs-backend-env

jobs:
  quick-and-contract:
    name: Quick and contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Backend (shallow)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked lightweight check environment
        run: >-
          uv sync --locked --group dev --extra unit
          --python "${PYTHON_VERSION}"

      - name: Quick check
        run: uv run --no-sync python tools/check_backend.py quick

      - name: Contract check
        run: uv run --no-sync python tools/check_backend.py contract

      - name: Confirm no tracked output was generated
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Detect a lockfile change
        id: lockfile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 origin "${base_sha}"
          if git diff --quiet "${base_sha}" HEAD -- uv.lock; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install the locked audit toolchain
        if: steps.lockfile.outputs.changed == 'true'
        run: uv sync --locked --group dev --python "${PYTHON_VERSION}"

      - name: Audit the changed locked dependency graph
        if: steps.lockfile.outputs.changed == 'true'
        shell: bash
        run: |
          uv export --quiet --locked --all-groups --all-extras \
            --no-emit-project --no-emit-local --no-sources \
            --format requirements.txt \
            --output-file "${RUNNER_TEMP}/backend-locked-requirements.txt"
          uv run --no-sync pip-audit \
            --requirement "${RUNNER_TEMP}/backend-locked-requirements.txt" \
            --require-hashes --disable-pip --strict --progress-spinner off
