# Production-candidate Agent egress policy. The Agent is attached only to the
# internal agent-proxy network; this proxy alone owns an external bridge.
http_port 3128

acl CONNECT method CONNECT
acl TLS_PORT port 443
acl ANTHROPIC_API dstdomain api.anthropic.com

http_access deny !CONNECT
http_access deny !TLS_PORT
http_access allow CONNECT ANTHROPIC_API
http_access deny all

cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename /tmp/squid.pid
