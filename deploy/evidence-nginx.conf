log_format evidence_safe '$remote_addr [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         'rt=$request_time';

server {
    listen 8443 ssl;
    server_name evidence-proxy;

    ssl_certificate /run/evidence-tls/tls.crt;
    ssl_certificate_key /run/evidence-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log /dev/stdout evidence_safe;
    error_log /dev/stderr warn;

    client_max_body_size 1m;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;

    location /internal/rag/v3/ {
        proxy_pass http://data:8010;
        proxy_http_version 1.1;
        proxy_set_header Host evidence-proxy;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
    }

    location / {
        return 404;
    }
}
