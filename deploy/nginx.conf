log_format customs_safe '$remote_addr [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       'rt=$request_time';

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log /dev/stdout customs_safe;
    error_log /dev/stderr warn;
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /health/ { proxy_pass http://backend:8080; }
    # OIDC query parameters may contain authorization codes, state, or logout
    # hints. They are intentionally absent from the global $uri-only log and
    # the whole identity path is additionally excluded from access logging.
    location /oidc/ {
        access_log off;
        proxy_pass http://keycloak:8080;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /auth/callback {
        access_log off;
        proxy_pass http://frontend:8080;
    }
    location / { proxy_pass http://frontend:8080; }
}
